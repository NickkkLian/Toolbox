<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工具箱 Toolbox</title>
<style>
:root{
  --bg:#F7F6F3; --card:#FFFFFF; --ink:#1F1D1A; --muted:#8A857C; --line:#E8E4DC;
  --accent:#C4552A; --ok:#2E7D52; --warn:#B7791F; --bad:#B3392E; --code:#F1EEE8;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
header{display:flex;align-items:center;gap:12px;padding:18px 22px;flex-wrap:wrap}
header h1{font-size:22px;letter-spacing:1px}
header .spacer{flex:1}
.btn{padding:8px 16px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:500}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
#wrap{display:flex;gap:16px;padding:0 22px 60px;align-items:flex-start}
#side{width:280px;flex:none;position:sticky;top:14px}
#side .doc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:box-shadow .15s}
#side .doc:hover{box-shadow:0 4px 14px rgba(0,0,0,.07)}
#side .doc.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
#side .doc .nm{font-weight:600;font-size:14.5px}
#side .doc .ds{color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.45}
#sbox{position:relative;margin-bottom:10px}
#sbox input{width:100%;padding:9px 30px 9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font:inherit;font-size:13.5px;color:inherit}
#sbox input:focus{outline:none;border-color:var(--accent)}
#qx{position:absolute;right:9px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--muted);display:none;font-size:13px;padding:2px 4px}
#sbox.has #qx{display:block}
#side .doc .hit{float:right;background:var(--accent);color:#fff;border-radius:999px;padding:0 7px;font-size:11px;font-weight:600;line-height:17px}
.sr{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:12px}
.sr .t{font-weight:600;font-size:14.5px;cursor:pointer;color:var(--accent)}
.sr .ln{font-size:12.5px;line-height:1.65;padding:5px 0;border-top:1px solid var(--line);cursor:pointer;color:var(--muted);white-space:pre-wrap;word-break:break-word}
.sr .ln:hover{color:var(--ink,inherit)}
mark{background:rgba(212,175,55,.4);color:inherit;border-radius:2px;padding:0 1px}
#main{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 32px}
.empty{color:var(--muted);padding:60px 22px;text-align:center}
/* markdown */
#main h1{font-size:24px;margin:6px 0 14px}
#main h2{font-size:19px;margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
#main h3{font-size:16.5px;margin:20px 0 8px}
#main h4{font-size:15px;margin:16px 0 6px}
#main p{margin:9px 0}
#main ul,#main ol{margin:9px 0;padding-left:26px}
#main li{margin:4px 0}
#main blockquote{border-left:3px solid var(--accent);background:var(--bg);padding:8px 14px;margin:12px 0;border-radius:0 8px 8px 0;color:#4c4842}
#main code{background:var(--code);border-radius:5px;padding:1px 6px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
#main pre{background:var(--code);border-radius:10px;padding:14px;overflow-x:auto;margin:12px 0}
#main pre code{background:none;padding:0}
#main table{width:100%;border-collapse:collapse;font-size:13.5px;margin:12px 0;display:block;overflow-x:auto}
#main th,#main td{padding:7px 9px;border:1px solid var(--line);text-align:left;vertical-align:top}
#main th{background:var(--bg);color:var(--muted);font-weight:600;font-size:12.5px;white-space:nowrap}
#main a{color:var(--accent)}
#main hr{border:none;border-top:1px solid var(--line);margin:18px 0}
#main .meta{color:var(--muted);font-size:12.5px;margin-bottom:14px}
/* config */
#cfg{max-width:520px;margin:40px auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;display:none}
#cfg.show{display:block}
#cfg .row{margin-bottom:12px}
#cfg label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:4px}
.notif{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 22px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
.notif.show{opacity:1;transform:translate(-50%,0)}
.notif.err{background:var(--bad)} .notif.ok{background:var(--ok)}
@media(max-width:760px){
  #wrap{flex-direction:column}
  #side{width:100%;position:static}
  #doclist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  #side .doc{margin-bottom:0}
  #main{padding:20px 16px;width:100%}
}
  .grp{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;
       margin:14px 0 6px;padding:4px 6px;border-radius:6px;
       font-size:.78rem;font-weight:700;letter-spacing:.04em;opacity:.72}
  .grp:hover{background:rgba(128,128,128,.10);opacity:1}
  .grp .caret{font-size:.7rem;width:10px}
  .grp .gname{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grp .gcount{font-size:.7rem;font-weight:600;opacity:.55;
       padding:1px 6px;border-radius:999px;background:rgba(128,128,128,.14)}

/* ===== 移动端与无障碍基线（2026-07-31 统一注入；规则源：web-interface-guidelines）===== */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important;
  }
}
button,a,summary,label,[role="button"],[onclick]{
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
:focus-visible{outline:2px solid currentColor;outline-offset:2px}

/* ===== 阅读进度条（取自 toolbox/design-vault 模式 #23；整页版）===== */
#readprog{position:fixed;top:0;left:0;right:0;height:3px;z-index:99;pointer-events:none;background:transparent}
#readprog i{display:block;height:100%;width:0;background:var(--accent);
  transition:width .08s linear;will-change:width}
</style>
</head>
<body>
<div id="readprog" aria-hidden="true"><i></i></div>
<header>
  <h1 data-i18n="title">工具箱</h1>
  <span class="spacer"></span>
  <button class="btn" onclick="refresh()" data-i18n="refresh">↻ 刷新</button>
  <button class="btn" onclick="toggleCfg()">⚙️</button>
  <button class="btn" onclick="toggleLang()">🌐</button>
</header>

<div id="cfg">
  <div class="row"><label>Owner</label><input id="cfg-own"></div>
  <div class="row"><label>Repo（私有数据仓库）</label><input id="cfg-rep" placeholder="Database"></div>
  <div class="row"><label>Token</label><input id="cfg-tok" type="password"></div>
  <div class="row"><label>Path（文档目录）</label><input id="cfg-pa" value="toolbox"></div>
  <button class="btn primary" onclick="connect()" data-i18n="connect">连接</button>
</div>

<div id="app" style="display:none">
  <div id="wrap">
    <div id="side">
      <div id="sbox"><input id="q" oninput="onSearch()" data-i18n-ph="searchPh" placeholder="搜索库内全文…"><span id="qx" onclick="clearSearch()">✕</span></div>
      <div id="doclist"></div>
    </div>
    <div id="main"><div class="empty" data-i18n="pick">← 选择一个主题档</div></div>
  </div>
</div>
<div class="notif" id="notif"></div>

<script>
/* ═══ 双语（与导航站共享 pha-lang）═══ */
let lang=(()=>{try{return localStorage.getItem("pha-lang")==="en"?"en":"zh"}catch(e){return "zh"}})();
const DICT={
  grpMisc:["未归类","Uncategorized"],
  title:["工具箱","Toolbox"],refresh:["↻ 刷新","↻ Refresh"],connect:["连接","Connect"],
  pick:["← 选择一个主题档","← Pick a topic doc"],sop:["整理归纳 SOP（本库说明）","Curation SOP (about this vault)"],
  connectFirst:["请先连接 GitHub","Connect GitHub first"],loading:["加载中…","Loading…"],
  refreshed:["已刷新","Refreshed"],loadFail:["加载失败","Load failed"],
  empty:["Database 的 toolbox/ 目录还没有文档","No docs in Database toolbox/ yet"],
  updated:["更新于","Updated"],
  searchPh:["搜索库内全文…","Search all docs…"],
  srHead:["条命中","hits"],srNone:["没有匹配","No matches"],srIn:["在","in"],
  srTip:["点任意一行跳到原文","Click any line to jump to it"]
};
const T=k=>(DICT[k]||[k,k])[lang==="en"?1:0];
function applyStatic(){document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=T(el.dataset.i18n)});
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{el.placeholder=T(el.dataset.i18nPh)});document.title=lang==="en"?"Toolbox":"工具箱 Toolbox";}
function toggleLang(){lang=lang==="zh"?"en":"zh";try{localStorage.setItem("pha-lang",lang)}catch(e){}applyStatic();renderSide();}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

let S={cfg:null,list:[],docs:{},cur:null,idx:{},grp:{},grpOrder:[],
  fold:(()=>{try{return JSON.parse(localStorage.getItem("toolbox_fold"))||{}}catch(e){return {}}})()};

/* ═══ GitHub 读取（全家标准 idiom：UTF-8 安全 base64；本 app 只读不写）═══ */
async function ghApi(url){
  const r=await fetch(url,{headers:{Authorization:`token ${S.cfg.token}`,Accept:"application/vnd.github+json"}});
  if(!r.ok)throw new Error(`${r.status} ${(await r.text()).slice(0,120)}`);
  return r.json();
}
/* S.q = 当前搜索词（空＝未搜索） */
const b64utf8=c=>new TextDecoder().decode(Uint8Array.from(atob(c.replace(/\n/g,"")),ch=>ch.charCodeAt(0)));

async function loadList(){
  const {owner,repo,path}=S.cfg;
  const dir=await ghApi(`https://api.github.com/repos/${owner}/${repo}/contents/${path}?_=${Date.now()}`);
  const files=dir.filter(f=>f.type==="file"&&/\.md$/i.test(f.name));
  /* INDEX.md 提供描述；README 置顶；INDEX 本身不列（它就是侧栏） */
  S.idx={}; S.grp={}; S.grpOrder=[];
  const idxFile=files.find(f=>f.name.toUpperCase()==="INDEX.MD");
  if(idxFile){
    try{
      const raw=b64utf8((await ghApi(idxFile.url)).content);
      /* INDEX.md 里的 ## 标题就是分类，之前被丢掉了，侧栏才平铺成一长条 */
      let cur="";
      raw.split("\n").forEach(l=>{
        const h=l.match(/^##\s+(.+?)\s*$/);
        if(h){ cur=h[1].replace(/[（(].*?[）)]\s*$/,"").trim(); if(!S.grpOrder.includes(cur))S.grpOrder.push(cur); return; }
        const m=l.match(/^\s*-\s*\[.*?\]\((.*?)\)\s*(?:—|-)\s*(.*)$/);
        if(m){ const f=m[1].trim(); S.idx[f]=m[2].trim(); if(cur)S.grp[f]=cur; }
      });
    }catch(e){}
  }
  const rest=files.filter(f=>!/^(INDEX)\.md$/i.test(f.name)&&!/^README\.md$/i.test(f.name))
                  .sort((a,b)=>a.name.localeCompare(b.name));
  const readme=files.find(f=>/^README\.md$/i.test(f.name));
  S.list=[...(readme?[readme]:[]),...rest].map(f=>({name:f.name,path:f.path,sha:f.sha}));
  try{localStorage.setItem("toolbox_cache",JSON.stringify({list:S.list,idx:S.idx,docs:S.docs}))}catch(e){}
}
async function loadDoc(name,force=false){
  const item=S.list.find(f=>f.name===name); if(!item)return;
  S.cur=name; renderSide();
  const cached=S.docs[name];
  if(cached&&!force){renderDoc(name);}
  else{
    document.getElementById("main").innerHTML=`<div class="empty">${T("loading")}</div>`;
    try{
      const {owner,repo}=S.cfg;
      const f=await ghApi(`https://api.github.com/repos/${owner}/${repo}/contents/${item.path}?_=${Date.now()}`);
      S.docs[name]=b64utf8(f.content);
      try{localStorage.setItem("toolbox_cache",JSON.stringify({list:S.list,idx:S.idx,docs:S.docs}))}catch(e){}
      renderDoc(name);
    }catch(e){document.getElementById("main").innerHTML=`<div class="empty">${T("loadFail")}: ${esc(e.message)}</div>`;}
  }
}

/* ═══ 精简 Markdown 渲染（覆盖本库子集：标题/列表/表格/代码/引用/链接/粗斜体/hr）═══ */
function inline(s){
  s=s.replace(/`([^`]+)`/g,(m,c)=>`<code>${c}</code>`);
  s=s.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<i>$2</i>");
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,t,u)=>{
    if(/^[\w.\-]+\.md$/i.test(u))return `<a href="#" onclick="loadDoc('${u.replace(/'/g,"")}');return false">${t}</a>`;
    if(/^https?:/i.test(u))return `<a href="${u}" target="_blank" rel="noopener">${t}</a>`;
    return t;
  });
  return s;
}
function mdRender(md){
  const lines=md.split("\n"); const out=[]; let i=0;
  const isTableSep=l=>/^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(l)&&l.includes("-");
  while(i<lines.length){
    let l=lines[i];
    if(/^\s*```/.test(l)){ /* 代码块 */
      const buf=[]; i++;
      while(i<lines.length&&!/^\s*```/.test(lines[i])){buf.push(lines[i]);i++;}
      i++; out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`); continue;
    }
    if(/^#{1,4}\s/.test(l)){const n=l.match(/^#+/)[0].length;out.push(`<h${n}>${inline(esc(l.replace(/^#+\s*/,"")))}</h${n}>`);i++;continue;}
    if(/^\s*(---+|\*\*\*+)\s*$/.test(l)){out.push("<hr>");i++;continue;}
    if(/^\s*>/.test(l)){
      const buf=[];while(i<lines.length&&/^\s*>/.test(lines[i])){buf.push(lines[i].replace(/^\s*>\s?/,""));i++;}
      out.push(`<blockquote>${mdRender(buf.join("\n"))}</blockquote>`);continue;
    }
    if(l.includes("|")&&i+1<lines.length&&isTableSep(lines[i+1])){ /* 表格 */
      const row=r=>r.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(c=>inline(esc(c.trim())));
      const head=row(l); i+=2; const body=[];
      while(i<lines.length&&lines[i].includes("|")&&lines[i].trim()!==""){body.push(row(lines[i]));i++;}
      out.push(`<table><thead><tr>${head.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>`+
        body.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")+`</tbody></table>`);continue;
    }
    let m=l.match(/^(\s*)([-*]|\d+[.、])\s+(.*)$/);
    if(m){ /* 列表（含续行：更深缩进的普通行并入上一项） */
      const ordered=/^\d/.test(m[2]); const items=[];
      while(i<lines.length){
        const lm=lines[i].match(/^(\s*)([-*]|\d+[.、])\s+(.*)$/);
        if(lm&&/^\d/.test(lm[2])!==ordered)break;
        if(lm){items.push(lm[3]);i++;}
        else if(/^\s{2,}\S/.test(lines[i])&&items.length){items[items.length-1]+=" "+lines[i].trim();i++;}
        else break;
      }
      out.push(`<${ordered?"ol":"ul"}>${items.map(t=>`<li>${inline(esc(t))}</li>`).join("")}</${ordered?"ol":"ul"}>`);continue;
    }
    if(l.trim()===""){i++;continue;}
    const buf=[l];i++;
    while(i<lines.length&&lines[i].trim()!==""&&!/^(#{1,4}\s|\s*```|\s*>|\s*([-*]|\d+[.、])\s|\s*(---+|\*\*\*+)\s*$)/.test(lines[i])&&!(lines[i].includes("|")&&i+1<lines.length&&isTableSep(lines[i+1]))){buf.push(lines[i]);i++;}
    out.push(`<p>${inline(esc(buf.join(" ")))}</p>`);
  }
  return out.join("\n");
}

/* ═══ 渲染 ═══ */
function dispName(f){
  if(/^README\.md$/i.test(f.name))return T("sop");
  const md=S.docs[f.name];
  if(md){const m=md.match(/^#\s+(.+)$/m);if(m)return m[1].trim();}
  return f.name.replace(/\.md$/i,"");
}
function toggleGrp(g){ S.fold[g]=!S.fold[g]; try{localStorage.setItem("toolbox_fold",JSON.stringify(S.fold))}catch(e){} renderSide(); }
function renderSide(){
  const el=document.getElementById("doclist");
  const hits=S.q?Object.fromEntries(searchHits(S.q).map(r=>[r.name,r.hits.length])):null;
  const list=hits?S.list.filter(f=>hits[f.name]):S.list;
  if(!list.length){ el.innerHTML=`<div class="empty">${S.q?T("srNone"):T("empty")}</div>`; return; }
  const card=f=>`
    <div class="doc ${S.cur===f.name?"on":""}" onclick="loadDoc('${esc(f.name)}')">
      <div class="nm">${hits?`<span class="hit">${hits[f.name]}</span>`:""}${/^README/i.test(f.name)?"📖 ":"📁 "}${esc(dispName(f))}</div>
      ${S.idx[f.name]?`<div class="ds">${esc(S.idx[f.name])}</div>`:""}
    </div>`;
  const pinned=list.filter(f=>/^README/i.test(f.name));            /* README 不进分类，永远置顶 */
  const rest=list.filter(f=>!/^README/i.test(f.name));
  const buckets=new Map();
  (S.grpOrder||[]).forEach(g=>buckets.set(g,[]));
  rest.forEach(f=>{ const g=(S.grp||{})[f.name]||T("grpMisc"); if(!buckets.has(g))buckets.set(g,[]); buckets.get(g).push(f); });
  let h=pinned.map(card).join("");
  for(const [g,arr] of buckets){
    if(!arr.length) continue;
    const folded=!S.q&&S.fold[g];      /* 搜索时一律展开，否则会以为没搜到 */
    h+=`<div class="grp ${folded?"fold":""}" onclick="toggleGrp('${esc(g).replace(/'/g,"&#39;")}')">
          <span class="caret">${folded?"\u25b8":"\u25be"}</span><span class="gname">${esc(g)}</span><span class="gcount">${arr.length}</span>
        </div>${folded?"":arr.map(card).join("")}`;
  }
  el.innerHTML=h;
}
function renderDoc(name){
  document.getElementById("main").innerHTML=mdRender(S.docs[name]||"");
  if(S.q)highlightIn(document.getElementById("main"),S.q);   // 从搜索结果点进来时保留高亮
  renderSide();
  if(window.__readprogUpdate)window.__readprogUpdate();       // 换文档后长度变了，重算进度
}

/* ═══ 库内全文搜索 ═══
   跨档搜必须先把所有文档取回来（每档几 KB，一次拉完；之后走 localStorage 缓存）。
   搜的是**原始 markdown**（所见即所搜），高亮打在**渲染后的 DOM 文本节点**上——
   直接对 HTML 串做 replace 会打碎标签。 */
async function loadAllDocs(){
  const miss=S.list.filter(f=>!S.docs[f.name]);
  if(!miss.length)return;
  const {owner,repo}=S.cfg;
  await Promise.all(miss.map(async f=>{
    try{const r=await ghApi(`https://api.github.com/repos/${owner}/${repo}/contents/${f.path}?_=${Date.now()}`);S.docs[f.name]=b64utf8(r.content);}catch(e){}
  }));
  try{localStorage.setItem("toolbox_cache",JSON.stringify({list:S.list,idx:S.idx,docs:S.docs}))}catch(e){}
}
function searchHits(q){
  const out=[];const needle=(q||"").trim().toLowerCase();if(!needle)return out;
  S.list.forEach(f=>{
    const md=S.docs[f.name];if(!md)return;
    const hits=[];
    md.split("\n").forEach((l,i)=>{
      const t=l.trim();
      if(t&&t.toLowerCase().includes(needle))hits.push({i,text:t});
    });
    // 文件名与 INDEX 描述也算命中（找得到「用途」那句话）
    const meta=(dispName(f)+" "+(S.idx[f.name]||"")).toLowerCase();
    if(!hits.length&&meta.includes(needle))hits.push({i:0,text:S.idx[f.name]||f.name});
    if(hits.length)out.push({name:f.name,hits});
  });
  return out;
}
function esc2(s){return esc(s);}
function renderResults(q){
  const res=searchHits(q);
  const total=res.reduce((n,r)=>n+r.hits.length,0);
  const main=document.getElementById("main");
  if(!res.length){main.innerHTML=`<div class="empty">${T("srNone")}：${esc(q)}</div>`;return;}
  main.innerHTML=`<div style="color:var(--muted);font-size:12.5px;margin-bottom:12px">${total} ${T("srHead")} · ${T("srIn")} ${res.length} ${lang==="en"?"docs":"个档"} · ${T("srTip")}</div>`+
    res.map(r=>`<div class="sr">
      <div class="t" onclick="openHit('${esc(r.name)}',0)">${/^README/i.test(r.name)?"📖 ":"📁 "}${esc(dispName({name:r.name}))} <span style="color:var(--muted);font-weight:400">· ${r.hits.length}</span></div>
      ${r.hits.slice(0,6).map(h=>`<div class="ln" onclick="openHit('${esc(r.name)}',${h.i})">${mark(h.text.slice(0,160),q)}</div>`).join("")}
      ${r.hits.length>6?`<div class="ln" style="cursor:default">…+${r.hits.length-6}</div>`:""}
    </div>`).join("");
}
function mark(text,q){
  const rx=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");
  return esc(text).replace(new RegExp(rx.source,"gi"),m=>`<mark>${m}</mark>`);
}
function highlightIn(root,q){
  if(!q)return;
  const rx=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  const targets=[];
  while(w.nextNode()){rx.lastIndex=0;if(rx.test(w.currentNode.nodeValue))targets.push(w.currentNode);}
  targets.forEach(n=>{
    const frag=document.createDocumentFragment();let last=0,m;rx.lastIndex=0;
    while((m=rx.exec(n.nodeValue))){
      frag.appendChild(document.createTextNode(n.nodeValue.slice(last,m.index)));
      const k=document.createElement("mark");k.textContent=m[0];frag.appendChild(k);
      last=m.index+m[0].length;
    }
    frag.appendChild(document.createTextNode(n.nodeValue.slice(last)));
    n.parentNode.replaceChild(frag,n);
  });
}
async function openHit(name,lineIdx){
  await loadDoc(name);
  const first=document.querySelector("#main mark");
  if(first)first.scrollIntoView({behavior:"smooth",block:"center"});
}
function onSearch(){
  const q=document.getElementById("q").value.trim();
  document.getElementById("sbox").classList.toggle("has",!!q);
  S.q=q;renderSide();
  if(q)renderResults(q);
  else if(S.cur)renderDoc(S.cur);
  else document.getElementById("main").innerHTML=`<div class="empty">${T("pick")}</div>`;
}
function clearSearch(){document.getElementById("q").value="";onSearch();}
async function refresh(){
  if(!S.cfg?.token){notify(T("connectFirst"),"err");return;}
  try{S.docs={};await loadList();renderSide();if(S.cur)await loadDoc(S.cur,true);await loadAllDocs();if(S.q)renderResults(S.q);renderSide();notify(T("refreshed"),"ok");}
  catch(e){notify(T("loadFail")+": "+e.message,"err");}
}

/* ═══ 连接 & 启动 ═══ */
function toggleCfg(){document.getElementById("cfg").classList.toggle("show");}
async function connect(){
  const v=id=>document.getElementById(id).value.trim();
  const c={owner:v("cfg-own"),repo:v("cfg-rep")||"Database",token:v("cfg-tok"),path:v("cfg-pa")||"toolbox"};
  try{localStorage.setItem("toolbox_cfg",JSON.stringify(c))}catch(e){}
  S.cfg=c;
  try{await loadList();}catch(e){notify("连接失败 "+e.message,"err");return;}
  document.getElementById("cfg").classList.remove("show");
  showApp();
}
function showApp(){
  document.getElementById("app").style.display="block";
  renderSide();
  if(!S.cur&&S.list.length)loadDoc(S.list[0].name);
  loadAllDocs().then(renderSide);   // 后台预取全部，搜索才能跨档；不阻塞首屏
}
let _nt;
function notify(msg,type=""){const el=document.getElementById("notif");el.textContent=msg;el.className=`notif show ${type}`;clearTimeout(_nt);_nt=setTimeout(()=>el.classList.remove("show"),2600);}

applyStatic();
(async()=>{
  try{
    const c=JSON.parse(localStorage.getItem("toolbox_cfg")||"{}");
    /* [hub-portal] 从共享配置 pha-config 补全 owner/repo/token（仅填空缺，不覆盖已填，不改 path） */
    try{var _pha=JSON.parse(localStorage.getItem("pha-config")||"null");if(_pha){if(!c.owner&&_pha.owner)c.owner=_pha.owner;if(!c.repo&&_pha.repo)c.repo=_pha.repo;if(!c.token&&_pha.token)c.token=_pha.token;}}catch(e){}
    if(c.owner)document.getElementById("cfg-own").value=c.owner;
    if(c.repo)document.getElementById("cfg-rep").value=c.repo;
    if(c.token)document.getElementById("cfg-tok").value=c.token;
    if(c.path)document.getElementById("cfg-pa").value=c.path;
    /* 本地缓存秒开，连接后刷新覆盖 */
    try{const cache=JSON.parse(localStorage.getItem("toolbox_cache")||"null");
      if(cache&&cache.list){S.list=cache.list;S.idx=cache.idx||{};S.docs=cache.docs||{};document.getElementById("app").style.display="block";renderSide();if(S.list.length)loadDoc(S.list[0].name);}}catch(e){}
    if(c.token&&c.owner){
      S.cfg={owner:c.owner,repo:c.repo||"Database",token:c.token,path:c.path||"toolbox"};
      await loadList();
      showApp();
    }else if(!S.list.length){document.getElementById("cfg").classList.add("show");}
  }catch(e){console.warn("Auto-connect failed:",e);if(!S.list.length){document.getElementById("cfg").classList.add("show");}}
})();

/* ===== 阅读进度条（design-vault #23）=====
   判据：分母是 scrollHeight - clientHeight，不是 scrollHeight —— 写错就永远到不了 100% */
(function(){
  var bar = document.querySelector('#readprog i');
  if(!bar) return;
  var ticking = false;
  function update(){
    var el = document.documentElement;
    var max = el.scrollHeight - el.clientHeight;
    bar.style.width = (max <= 0 ? 0 : (el.scrollTop / max) * 100) + '%';
    ticking = false;
  }
  function onScroll(){ if(!ticking){ ticking = true; requestAnimationFrame(update); } }
  addEventListener('scroll', onScroll, {passive:true});
  addEventListener('resize', onScroll, {passive:true});
  update();
  window.__readprogUpdate = update;   // 文档切换后由 loadDoc 调一次
})();
</script>
